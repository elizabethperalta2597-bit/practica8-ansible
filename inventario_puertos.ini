# Alternativa si las IPs de los contenedores no se alcanzan desde tu equipo
# (pasa con Docker Desktop en Windows/Mac). Usa los puertos publicados 2201-2205.
# Uso: ansible-playbook -i inventario_puertos.ini playbooks/site.yml
[servidores]
servidor1 ansible_host=127.0.0.1 ansible_port=2201
servidor2 ansible_host=127.0.0.1 ansible_port=2202
servidor3 ansible_host=127.0.0.1 ansible_port=2203
servidor4 ansible_host=127.0.0.1 ansible_port=2204
servidor5 ansible_host=127.0.0.1 ansible_port=2205

[servidores:vars]
ansible_user=ansible
ansible_password=ansible
ansible_become=true
ansible_become_method=sudo
